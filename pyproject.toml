[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "miguels-blog"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "aiosmtplib>=5.1.2",
    "aiosqlite>=0.22.1",
    "anyio>=4.0",
    "asyncpg>=0.31.0",
    "fastapi[standard]>=0.137.2",
    "httpx>=0.28.1",
    "pillow>=12.2.0",
    "psycopg[binary]>=3.3.4",
    "pwdlib[argon2]>=0.3.0",
    "pydantic>=2.13.4",
    "pydantic-extra-types>=2.11.1",
    "pydantic-settings>=2.14.1",
    "PyJWT>=2.13.0",
    "SQLAlchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "alembic>=1.18.5",
    "boto3>=1.28.57",
]

[project.optional-dependencies]
test = [
    "pytest>=9.1.0",
    "moto[s3]>=5.2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = false
